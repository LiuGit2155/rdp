name: Windows Tailscale RDP
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 直链下载安装 Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/windows/tailscale-setup.exe" -OutFile tailscale-setup.exe
          .\tailscale-setup.exe /install /quiet
          Start-Sleep 10

      - name: 启动 Tailscale 并加入网络
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up
          Start-Sleep 20

      - name: 输出虚拟IP地址
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
