name: Windows Tailscale RDP
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 使用镜像下载 Tailscale
        run: |
          Invoke-WebRequest -Uri "https://mirror.ghproxy.com/https://github.com/tailscale/tailscale/releases/latest/download/tailscale-setup.exe" -OutFile tailscale-setup.exe
          .\tailscale-setup.exe /install /quiet /norestart
          Start-Sleep 15

      - name: 启动组网
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up
          Start-Sleep 30

      - name: 输出IP
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
