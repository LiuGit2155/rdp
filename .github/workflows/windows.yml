name: Windows Tailscale RDP
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 重置 runneradmin 密码
        run: |
          $newPwd = ConvertTo-SecureString "123456Aa!" -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $newPwd

      - name: 安装 Tailscale
        run: |
          winget install Tailscale.Tailscale --accept-source-agreements --accept-package-agreements
          Start-Sleep 10

      - name: 启动Tailscale 等待授权（2分钟）
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up
          Start-Sleep 120

      - name: 输出连接IP
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
