name: Windows Web Desktop
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 下载noVNC网页桌面
        run: |
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .

      - name: 下载Ngrok穿透工具
        run: |
          Invoke-WebRequest -OutFile ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip
          Expand-Archive ngrok.zip

      - name: 启动Ngrok+noVNC服务
        env:
          NGROK_AUTH: ${{ secrets.NGROK_AUTH }}
        run: |
          cd ngrok
          ./ngrok.exe authtoken $env:NGROK_AUTH
          Start-Process ./ngrok.exe -ArgumentList "http 8080 --region hk" -WindowStyle Hidden
          cd ../noVNC-master
          Start-Process python -ArgumentList "websockify.py --web . 8080 localhost:3389" -WindowStyle Hidden
          Start-Sleep 45

      - name: 等待接口就绪并获取完整公网链接
        run: |
          Start-Sleep 10
          $resp = Invoke-WebRequest "http://localhost:4040/api/tunnels"
          $jsonObj = $resp.Content | ConvertFrom-Json
          $fullUrl = $jsonObj.tunnels[0].public_url
          Write-Host "✅ 手机访问完整地址：$fullUrl/vnc.html"
