name: Windows Tailscale RDP
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 静默下载安装 Tailscale（无协议弹窗）
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/windows/tailscale-setup.exe" -OutFile tailscale-setup.exe
          .\tailscale-setup.exe /install /quiet /norestart
          Start-Sleep 12

      - name: 启动并加入 Tailscale 网络
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up
          Start-Sleep 25

      - name: 打印可连接IP
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
