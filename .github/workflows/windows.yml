name: Windows Web Desktop
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      - name: 下载并启动网页版远程桌面
        run: |
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .
          cd noVNC-master
          Start-Process python -ArgumentList "websockify.py --web . 8080 localhost:3389" -WindowStyle Hidden
      - name: 输出本地访问地址
        run: |
          Write-Host "本地网页地址：http://localhost:8080/vnc.html"
