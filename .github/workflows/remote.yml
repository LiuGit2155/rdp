name: Windows ToDesk 云电脑
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: 使用 winget 静默安装 ToDesk
        run: |
          winget install ToDesk.ToDeskLite --accept-source-agreements --accept-package-agreements
          Start-Sleep 20

      - name: 输出设备码与临时密码
        run: |
          $todesk = "C:\Program Files\ToDesk\ToDesk.exe"
          Write-Host "=== 远程设备码 ==="
          & $todesk --get-device-id
          Write-Host "=== 临时连接密码 ==="
          & $todesk --get-password
          # 保持机器在线不销毁
          while($true) { Start-Sleep 60 }
